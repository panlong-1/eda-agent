[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-agent"
version = "0.0.1"
description = "An evidence-gated agent for digital chip design, driving open-source EDA tools over MCP"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["anthropic>=2", "mcp>=2", "openai>=1.40", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# mutate: avl-core generates the source-level mutants (MIT; pulls in pyslang and cocotb)
mutation = ["avl-core==1.2.0"]

[project.scripts]
eda-mcp = "eda_agent.server.mcp_server:main"
eda-agent = "eda_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eda_agent = ["prompts/*.md", "prompts/*.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["eda: needs Verilator and a design checkout (slow)"]
