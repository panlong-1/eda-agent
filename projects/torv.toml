# TORV rv32m SoC (https://github.com/semitov/torv), driven through its own scripts.
name = "torv"
root = "~/project/rv32m"
env_script = "scripts/env.sh"

[env_defaults]
PDK_ROOT = "~/.ciel"

# Recorded in every regress result, so a check can be repeated with the same tools.
[versions]
verilator = ["verilator", "--version"]
gcc = ["riscv64-unknown-elf-gcc", "--version"]

[lint]
top = "torv_soc"
filelists = ["rtl/filelist.f", "ip/filelist.f"]
include_dirs = ["rtl", "ip/third_party/socbus/include"]
defines = ["FUNCTIONAL"]
# Same suppressions as scripts/verilator_build.sh, plus -Wall for lint.
flags = ["-Wall", "-Wno-fatal", "--timing", "-Wno-TIMESCALEMOD", "-Wno-ASSIGNIN"]

[regress]
format = "torv"
cmd = ["scripts/regress.sh"]
case_list = "regress/cases/soc.list"
case_flag = "--case"
summary_file = "summary.rpt"
timeout_s = 1800

# Mutation runs (mutate): mutants of these files, judged by these cases, each in a copy of the
# checkout under runs/work/. Build and result directories are not copied and are emptied per mutant.
[mutation]
files = ["rtl/torv_forwarding_unit.sv", "rtl/torv_hazard_unit.sv", "rtl/torv_muldiv_unit.sv"]
cases = ["bypass", "hazard", "flush", "muldiv", "muldiv_stall", "hazard_branch_mem_stall"]
copy_exclude = [".git", "build", "librelane/runs", "regress/results", ".torv_last_case_build_dir"]
jobs = 4
timeout_s = 1500   # per mutant; the whole case list (survivor re-check) takes about 7 min

# New tests (write_case, score_tests): how ONE test file runs; pass/fail as for the regression.
# The detailed output (with [PASS]/[PERF]) is the case's sim log; register is the case-list line
# the patch adds. New tests are written only to generated/<run_id>/ and run only in copies.
[tests]
run = ["scripts/run_case.sh", "--max-cycles", "50000", "{file}"]
log = "build/sim/soc/{name}/{name}.sim.log"
register = "{name}  asm  {path}  50000"

# Performance (perf): the testbench prints these [PERF] lines at the end of every case
# (scripts/perf_summary.py reads the same lines). The baseline, projects/torv.perf-baseline.json,
# is written only by a person with `eda-agent perf-baseline`.
[perf]
patterns = [
    '\[PERF\] cycles=(?P<cycles>\d+) instr=(?P<instr>\d+) ipc=(?P<ipc>[\d.]+)',
    '\[PERF\] stall if=(?P<stall_if>\d+) id=(?P<stall_id>\d+) ex=(?P<stall_ex>\d+) flush=(?P<flush>\d+)',
]
key = "cycles"
cases = ["perf_alu_chain", "perf_branch_loop", "perf_loadstore_loop", "perf_mul_loop", "hazard", "bypass"]

# Synthesis + pre-PnR timing estimate (synth, check_sdc). Mirrors librelane/config.yaml:
# DESIGN_NAME, VERILOG_FILES, USE_SLANG, SYNTH_MUL_BOOTH, CLOCK_PORT, CLOCK_PERIOD and the SDC.
# The SDC is the design team's; the agent only reads it.
[flow]
top = "torv_cpu"
files = [
    "rtl/torv_addr_decode.sv", "rtl/torv_pc_unit.sv", "rtl/torv_regfile.sv", "rtl/torv_imm_gen.sv",
    "rtl/torv_decoder.sv", "rtl/torv_alu_ctrl.sv", "rtl/torv_alu.sv", "rtl/torv_muldiv_unit.sv",
    "rtl/torv_forwarding_unit.sv", "rtl/torv_hazard_unit.sv", "rtl/torv_lsu.sv", "rtl/torv_core.sv",
    "rtl/torv_ahb_dport.sv", "rtl/torv_ahb_fetch.sv", "rtl/torv_cpu.sv",
]
include_dirs = ["rtl"]
frontend = "slang"
synth_flags = ["-booth"]
sdc = "librelane/constraints.sdc"
clock_port = "hclk"
clock_period = 10.0
image = "ghcr.io/librelane/librelane:3.0.16"
pdk = "ihp-sg13g2"
pdk_root = "${PDK_ROOT}"
liberty = "${PDK_ROOT}/ihp-sg13g2/libs.ref/sg13g2_stdcell/lib/sg13g2_stdcell_typ_1p20V_25C.lib"
dont_use_file = "${PDK_ROOT}/ihp-sg13g2/libs.tech/librelane/sg13g2_stdcell/synth_exclude.cells"
tie_hi = "sg13g2_tiehi/L_HI"
tie_lo = "sg13g2_tielo/L_LO"
buffer = "sg13g2_buf_1/A/X"
# LibreLane's SYNTH_DRIVING_CELL / ABC load for IHP: without them ABC does not buffer high fanout
abc_driving_cell = "sg13g2_buf_4"
abc_load = 6.0

# Same three corners as LibreLane's STA_CORNERS for IHP SG13G2.
[flow.corners]
typ = "${PDK_ROOT}/ihp-sg13g2/libs.ref/sg13g2_stdcell/lib/sg13g2_stdcell_typ_1p20V_25C.lib"
slow = "${PDK_ROOT}/ihp-sg13g2/libs.ref/sg13g2_stdcell/lib/sg13g2_stdcell_slow_1p08V_125C.lib"
fast = "${PDK_ROOT}/ihp-sg13g2/libs.ref/sg13g2_stdcell/lib/sg13g2_stdcell_fast_1p32V_m40C.lib"

# RTL-to-GDS (flow_report, flow_run): LibreLane with the team's own config. flow_report reads the
# design's runs (librelane/runs); flow_run runs on a copy of the root under work_dir, never in it.
[pnr]
config = "librelane/config.yaml"
baseline = "full_p10"
copy_exclude = [".git", "build", "regress/results", ".torv_last_case_build_dir", "docs"]
timeout_s = 10800
