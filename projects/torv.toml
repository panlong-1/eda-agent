# TORV rv32m SoC (https://github.com/semitov/torv), driven through its own scripts.
name = "torv"
root = "~/project/rv32m"
env_script = "scripts/env.sh"

[env_defaults]
PDK_ROOT = "~/.ciel"

# Recorded in every regress result, so a check can be repeated with the same tools.
[versions]
verilator = ["verilator", "--version"]
gcc = ["riscv64-unknown-elf-gcc", "--version"]

[lint]
top = "torv_soc"
filelists = ["rtl/filelist.f", "ip/filelist.f"]
include_dirs = ["rtl", "ip/third_party/socbus/include"]
defines = ["FUNCTIONAL"]
# Same suppressions as scripts/verilator_build.sh, plus -Wall for lint.
flags = ["-Wall", "-Wno-fatal", "--timing", "-Wno-TIMESCALEMOD", "-Wno-ASSIGNIN"]

[regress]
cmd = ["scripts/regress.sh"]
case_list = "regress/cases/soc.list"
case_flag = "--case"
summary_file = "summary.rpt"
timeout_s = 1800
